version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      all:
        patterns:
          - "*"
    ignore:
      # @types/node tracks the node major CI runs (24.x); bump it with CI's matrix, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
